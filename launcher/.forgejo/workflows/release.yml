# The launcher's releases (docs/releases.md; how to make one: RELEASING.md). The same workflow as MagicBeanDev/Longshot's,
# but for what is built: here the launcher itself, released apart from Longshot, on its own three channels.
#
#   a push to main       the nightly: nightly-<commits on main>-<commit>, a pre-release
#   a tag vX.Y.Z-rc.N    a release candidate, a pre-release (the rc channel)
#   a tag vX.Y.Z         a stable (the stable channel, and rc too). The launcher's first is v1.0.0
#
# 1. version: the version's name; a tag is checked first (scripts/release.py check-tag: its form, on main, above every
#    release, and as high as the commits since the last stable call for). A refused tag builds nothing.
# 2. build: LongshotLauncher-<v>-windows-x64-setup.exe (the program, which offers to install itself), LongshotLauncher-<v>-
#    windows-x64-portable.zip (the same program and its "portable" file) and LongshotLauncher-<v>-x86_64.AppImage
#    (scripts/package.sh, on Linux). Each program is started with --self-check before it is kept: the AppImage's by package.sh,
#    the Windows program's under Wine (there is no Windows runner): a build of it that unpacks itself to disk, since Wine cannot
#    load the shipped one, which .NET maps from the uncompressed file. Whether the shipped file starts is a Windows tester's.
# 3. publish: SHA256SUMS over them, SHA256SUMS.sig (the release key), the notes (git-cliff, cliff.toml), then a draft
#    release with every file, published last: until then no launcher sees it. A nightly also prunes the nightlies past the
#    newest 5. Nothing is committed back to the repository.
#
# The release is made with the job's own token (forgejo.token, passed to scripts/release.py as RELEASE_TOKEN): no bot account,
# no token secret. Only the publish job may write (contents: write: this repository's releases and tags); the others read.
# Secret (RELEASING.md, One-time setup; an organization secret, shared with Longshot): RELEASE_SIGNING_KEY (the release key's
# private PEM). Variable: RELEASE_UPLOAD_API (passed to release.py as FORGEJO_UPLOAD_API; Forgejo reserves the FORGEJO_ prefix for variables), the API's address without Cloudflare in front, when a file is larger than its
# 100 MB upload limit.
name: Release
on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  version:
    name: The version
    runs-on: quick  # (a quick job: the runner kept free for these takes it, or any runner with room)
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.name.outputs.tag }}
      ref: ${{ steps.name.outputs.ref }}
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: name
        env:
          RELEASE_TOKEN: ${{ forgejo.token }}
        run: |
          git fetch -q --tags origin main
          ref=$(git rev-parse HEAD)
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            tag=${GITHUB_REF#refs/tags/}
            python3 -I scripts/release.py check-tag "$tag" --main origin/main
          else
            # (a nightly whose commit is no longer main's skips itself: the release runs queue one at a time, and of a few
            # merges in a row only the newest one builds; the one already running goes on)
            head=$(git rev-parse origin/main)
            if [[ $GITHUB_EVENT_NAME == push && $head != "$ref" ]]; then
              echo "::notice::main has moved on to ${head:0:8}: this nightly skips, the newer one builds"
              echo "tag=" >> "$GITHUB_OUTPUT"
              echo "ref=$ref" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tag=$(python3 -I scripts/release.py nightly-name)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "$tag, from $ref"

  build:
    name: The launcher, both systems
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false
      - uses: https://github.com/actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: The Windows setup, the portable zip and the AppImage
        env:
          WINE_CHECK_EXE: ${{ runner.temp }}/wine-check/LongshotLauncher.exe
        run: scripts/package.sh "${{ needs.version.outputs.tag }}" dist
      # (the same code built to unpack itself to disk: Wine cannot load the shipped program, whose code .NET maps from the
      # uncompressed file, "Incorrect alignment (0x8007046C)". The shipped file is not started here: RELEASING.md)
      - name: The Windows program starts (--self-check, under Wine)
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo=; [[ $(id -u) == 0 ]] || sudo=sudo
          $sudo dpkg --add-architecture i386 || true
          $sudo apt-get update -qq
          $sudo apt-get install -y -qq --no-install-recommends wine wine64 >/dev/null
          wine=$(command -v wine64 || command -v wine)
          export WINEDEBUG=-all WINEPREFIX="$RUNNER_TEMP/wine"
          "$wine" wineboot --init >/dev/null 2>&1 || true
          out=$("$wine" "$RUNNER_TEMP/wine-check/LongshotLauncher.exe" --self-check | tr -d '\r')
          echo "$out"
          grep -qxF "LongshotLauncher $TAG" <<<"$out" || { echo "::error::the Windows launcher does not answer --self-check with $TAG"; exit 1; }
      # (an artifact goes to Forgejo by its public address, ROOT_URL, behind Cloudflare, whatever address the runner has: a
      # request there can fail once, and the action does not send a block again (2026-11-13, the launcher's nightly: one
      # 8 MB block, "SSL alert bad record mac"). Sent once more when it failed: Forgejo takes the same name again)
      - id: upload_1
        continue-on-error: true
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4 (Forgejo's: GitHub's v4 and later refuse a server that is not github.com)
        with:
          name: LongshotLauncher
          path: dist/LongshotLauncher-*
          if-no-files-found: error
      - if: steps.upload_1.outcome == 'failure'
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4 (Forgejo's: GitHub's v4 and later refuse a server that is not github.com)
        with:
          name: LongshotLauncher
          path: dist/LongshotLauncher-*
          if-no-files-found: error

  publish:
    name: Sign and publish
    needs: [version, build]
    if: needs.version.outputs.tag != ''
    runs-on: quick  # (a short job: it starts as the builds end, never behind them; the same machine and secrets)
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      REF: ${{ needs.version.outputs.ref }}
      RELEASE_TOKEN: ${{ forgejo.token }}
      FORGEJO_UPLOAD_API: ${{ vars.RELEASE_UPLOAD_API }}
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      # (from Forgejo's public address behind Cloudflare, as the build jobs' upload: fetched once more when it failed)
      - id: download_2
        continue-on-error: true
        uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          name: LongshotLauncher
          path: files
      - if: steps.download_2.outcome == 'failure'
        uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          name: LongshotLauncher
          path: files
      - name: The files
        run: |
          git fetch -q --tags origin
          ls -l files
          test -f "files/LongshotLauncher-$TAG-windows-x64-setup.exe" && test -f "files/LongshotLauncher-$TAG-windows-x64-portable.zip" \
            && test -f "files/LongshotLauncher-$TAG-x86_64.AppImage"
      - name: SHA256SUMS, signed
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [[ -n $KEY ]] || { echo "::error::no RELEASE_SIGNING_KEY secret (RELEASING.md, One-time setup)"; exit 1; }
          python3 -I scripts/release.py sums files/* --out files/SHA256SUMS
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key.pem"
          python3 -I scripts/release.py sign files/SHA256SUMS --key "$RUNNER_TEMP/key.pem" --out files/SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/key.pem"
          # (checked with the key this launcher is built with, not the one just used: a key it does not trust stops here)
          python3 -I scripts/release.py verify files/SHA256SUMS --files files
          cat files/SHA256SUMS
      - name: The notes
        run: |
          GIT_CLIFF=$(python3 -I scripts/release.py git-cliff "$RUNNER_TEMP/cliff")
          export GIT_CLIFF
          python3 -I scripts/release.py notes "$TAG" --out notes.md
          cat notes.md
      - name: Publish
        run: python3 -I scripts/release.py publish "$TAG" --target "$REF" --notes notes.md files/*
      - name: Prune the nightlies
        if: startsWith(needs.version.outputs.tag, 'nightly-')
        run: python3 -I scripts/release.py prune --keep 5
